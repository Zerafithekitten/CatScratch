name: Game companion verification
on:
  push:
    branches: [beta]
    paths:
      - 'src/AionMeter.App/Services/GameLifetime.cs'
      - 'tools/check-game-companion.ps1'
      - '.github/workflows/game-companion.yml'
permissions:
  contents: read
jobs:
  companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: ./tools/check-game-companion.ps1
