name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        default: v1.0.1
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version and test
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-beta\.[1-9]\d*)?$') { throw 'Use v1.0.0 or v1.0.0-beta.1' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "APP_NUMERIC_VERSION=$($version.Split('-')[0])" >> $env:GITHUB_ENV
          "IS_BETA=$($version.Contains('-beta.'))" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          dotnet test tests/AionMeter.Tests/AionMeter.Tests.csproj -c Release
          if ($LASTEXITCODE) { throw 'Tests failed' }
      - name: Build self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish src/AionMeter.App/AionMeter.App.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:UpdateRepository=$env:GITHUB_REPOSITORY -o dist/payload
          if ($LASTEXITCODE) { throw 'Publish failed' }
          Copy-Item LICENSE dist/payload
          Copy-Item INSTALL.txt dist/payload
          foreach ($file in @('CatScratch.GameWatcher.exe', 'sounds/Chime.wav', 'sounds/Bell.wav', 'sounds/Ping.wav', 'data/patchnotes-en.md', 'data/pets/catalog.json', 'data/pets/locations.json')) {
            if (-not (Test-Path -LiteralPath "dist/payload/$file")) { throw "Required app resource missing: $file" }
          }
          Compress-Archive -Path dist/payload/* -DestinationPath dist/CatScratch-win-x64.zip
          git archive --format=zip --output=dist/CatScratch-source.zip HEAD
      - name: Verify event panels and complete shutdown
        shell: pwsh
        run: |
          foreach ($check in @('interaction', 'shutdown', 'performance', 'event-audio', 'release250', 'boss-records', 'beta4', 'checklist', 'panel', 'enhancements', 'placement', 'boss-timing', 'clickthrough-startup', 'world-boss-events', 'topmost')) {
            $result = "$env:RUNNER_TEMP/meter-$check.txt"
            $process = Start-Process "$PWD/dist/payload/CatScratch.exe" -ArgumentList @("--check-$check",("`"$result`"")) -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(20000)) { Stop-Process -Id $process.Id; throw "$check verification timed out" }
            Get-Content $result
            $process.Refresh()
            if ($process.ExitCode) { throw "$check verification failed" }
            if ($check -in @('interaction', 'event-audio', 'release250', 'boss-records', 'beta4', 'checklist', 'panel', 'enhancements', 'placement', 'boss-timing', 'clickthrough-startup', 'world-boss-events', 'topmost')) { $null = Get-Content $result -Raw | ConvertFrom-Json -ErrorAction Stop }
          }
          # Diagnostics may create their own empty cache folders. Never include them in Setup.
          $payload = [IO.Path]::GetFullPath("$PWD/dist/payload").TrimEnd('\') + '\'
          foreach ($name in @('userdata', 'captures')) {
            $testData = [IO.Path]::GetFullPath((Join-Path $payload $name))
            if (-not $testData.StartsWith($payload, [StringComparison]::OrdinalIgnoreCase)) { throw 'Invalid diagnostic cleanup path' }
            if (Test-Path -LiteralPath $testData) { Remove-Item -LiteralPath $testData -Recurse -Force }
          }
      - name: Verify custom colors survive a new process
        shell: pwsh
        run: |
          $settings = Join-Path $env:RUNNER_TEMP 'theme-restart-settings.json'
          foreach ($mode in @('write', 'read')) {
            $arguments = @('--check-theme-restart',("`"$settings`""))
            if ($mode -eq 'write') { $arguments += '--write' }
            $process = Start-Process "$PWD/dist/payload/CatScratch.exe" -ArgumentList $arguments -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(20000)) { Stop-Process -Id $process.Id; throw 'Color restart verification timed out' }
            $process.Refresh()
            if ($process.ExitCode) { throw 'Color restart verification failed' }
            $result = Get-Content "$settings.result.json" -Raw | ConvertFrom-Json -ErrorAction Stop
            if ($mode -eq 'read' -and $result.Stage -ne 'restarted') { throw 'Colors were not restored in a new process' }
          }
      - name: Verify optional game companion
        shell: pwsh
        run: ./tools/check-game-companion.ps1
      - name: Verify direct update and preserved userdata
        shell: pwsh
        run: ./tools/check-direct-update.ps1 -Payload "$PWD/dist/payload"
      - name: Install official Inno Setup compiler
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe -OutFile "$env:RUNNER_TEMP/inno.exe"
          $signature = Get-AuthenticodeSignature "$env:RUNNER_TEMP/inno.exe"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') { throw 'Compiler signature invalid' }
          $compiler = "$env:RUNNER_TEMP/Inno"
          $install = Start-Process "$env:RUNNER_TEMP/inno.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR=`"$compiler`"")) -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode) { throw 'Compiler installation failed' }
          "INNO_COMPILER=$compiler/ISCC.exe" >> $env:GITHUB_ENV
      - name: Build installer
        shell: pwsh
        run: |
          & $env:INNO_COMPILER /Qp "/DAppVer=$env:APP_VERSION" "/DNumericVer=$env:APP_NUMERIC_VERSION" "/DUpdateRepo=$env:GITHUB_REPOSITORY" "/DPayloadDir=$PWD/dist/payload" "/O$PWD/dist" installer/CatScratch.iss
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          Copy-Item "dist/CatScratch-Setup-v$env:APP_VERSION.exe" dist/CatScratch-Setup.exe
          $setupInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo("$PWD/dist/CatScratch-Setup.exe")
          if ($setupInfo.ProductName.Trim() -ne 'Zerafi DPS Monitor') { throw 'Legacy update compatibility missing' }
          $appInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo("$PWD/dist/payload/CatScratch.exe")
          if ($appInfo.ProductName.Trim() -ne 'CatScratch') { throw 'App branding incorrect' }
      - name: Publish release downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Get-Content data/patchnotes-en.md -Raw
          $heading = [regex]::Escape("## CatScratch $env:RELEASE_TAG")
          $section = [regex]::Match($notes, "(?ms)^$heading\s*\r?\n(.*?)(?=^## |\z)")
          if (-not $section.Success -or -not $section.Groups[1].Value.Trim()) { throw 'Patch notes for this release are missing' }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesFile -Value $section.Groups[1].Value.Trim() -Encoding utf8
          $releaseArgs = @('release','create',$env:RELEASE_TAG,'dist/CatScratch-Setup.exe','dist/CatScratch-win-x64.zip','dist/CatScratch-source.zip','--verify-tag','--notes-file',$notesFile)
          if ($env:IS_BETA -eq 'True') { $releaseArgs += @('--prerelease','--latest=false') } else { $releaseArgs += '--latest' }
          gh @releaseArgs
          if ($LASTEXITCODE) { throw 'Release publication failed' }
